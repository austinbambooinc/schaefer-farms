# Decap CMS + DecapBridge configuration for Schaefer Farms

# Use DecapBridge PKCE auth
backend:
  name: git-gateway
  repo: austinbambooinc/schaefer-farms
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/ab314ab1-6ca7-4e8f-8161-386409f6aab0/pkce
  auth_token_endpoint: /sites/ab314ab1-6ca7-4e8f-8161-386409f6aab0/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://schaeferfarms.netlify.app

# Uploaded images/files will be saved here in the repo
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: honey
    label: Honey Products
    label_singular: Honey Product
    folder: src/content/honey
    create: true
    extension: md
    format: frontmatter
    fields:
      - label: Product Name
        name: title
        widget: string

      - label: Description
        name: description
        widget: text
        required: false

      - label: Price
        name: price
        widget: string
        required: false
        hint: "Example: $12.00"

      - label: Product Image
        name: image
        widget: image
        required: false

      - label: Available
        name: available
        widget: boolean
        default: true
        required: false

      - label: Body
        name: body
        widget: markdown
        required: false

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    create: true
    extension: md
    format: frontmatter
    fields:
      - label: Page Title
        name: title
        widget: string

      - label: SEO
        name: seo
        widget: object
        required: false
        fields:
          - { label: Meta Title, name: meta_title, widget: string, required: false, hint: "Overrides page title in browser tab & search results (optional)" }
          - { label: Meta Description, name: meta_description, widget: text, required: false, hint: "Shown in search engine results only — not visible on the page" }
          - { label: Meta Keywords, name: meta_keywords, widget: string, required: false, hint: "Comma-separated, optional" }

      - label: Featured Image
        name: image
        widget: image
        required: false

      - label: Body
        name: body
        widget: markdown
        required: false

  - name: "blog"
    label: "News/Blog"
    folder: "src/content/blog"
    create: true
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        fields:
          - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
          - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
          - { label: "Meta Keywords", name: "meta_keywords", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "minerals"
    label: "Minerals"
    folder: "src/content/minerals"
    create: true
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Price", name: "price", widget: "string", required: false, hint: "Example: $12.00" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        fields:
          - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
          - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
          - { label: "Meta Keywords", name: "meta_keywords", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "global"
        label: "Global Settings"
        file: "src/content/settings/global.yml"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string", required: false }
          - { label: "Mission Statement", name: "mission_statement", widget: "text", required: false }
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - { label: "Primary Color", name: "primary_color", widget: "color", required: false }
          - { label: "Accent Color", name: "accent_color", widget: "color", required: false }
          - { label: "Background Color", name: "background_color", widget: "color", required: false }
          - label: "Font Family"
            name: "font_family"
            widget: "select"
            required: false
            options:
              - { label: "Serif (Georgia)", value: "'Georgia', serif" }
              - { label: "Sans-serif (Helvetica)", value: "'Helvetica Neue', Arial, sans-serif" }
              - { label: "Rounded (Poppins)", value: "'Poppins', sans-serif" }
              - { label: "Classic (Times)", value: "'Times New Roman', serif" }
          - { label: "Contact Email", name: "contact_email", widget: "string", required: false }
          - label: "Navigation Items"
            name: "nav_items"
            widget: "list"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }