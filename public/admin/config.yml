backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ── 1. GLOBAL SITE SETTINGS (colors, font, logo) ──
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Global Appearance"
        name: "global"
        file: "src/content/settings/global.yml"
        fields:
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - { label: "Primary Color", name: "primary_color", widget: "color" }
          - { label: "Secondary Color", name: "secondary_color", widget: "color" }
          - { label: "Background Color", name: "background_color", widget: "color" }
          - label: "Font"
            name: "font"
            widget: "select"
            options: ["System Default", "Georgia", "Verdana", "Trebuchet MS"]

  # ── 2. PAGES (with sub-page support) ──
  - name: "pages"
    label: "Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Parent Page (leave blank if top-level)", name: "parent", widget: "string", required: false }
      - label: "Content Blocks"
        name: "blocks"
        widget: "list"
        types:
          - label: "Text Block"
            name: "text"
            widget: "object"
            fields:
              - { label: "Content", name: "body", widget: "markdown" }
          - label: "Image"
            name: "image"
            widget: "object"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
          - label: "Button/Link"
            name: "button"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Contact Form Embed"
            name: "form"
            widget: "object"
            fields:
              - { label: "Form Name", name: "form_name", widget: "string" }
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        fields:
          - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
          - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
          - { label: "Meta Keywords", name: "meta_keywords", widget: "string", required: false }

  # ── 3. HONEY PRODUCTS ──
  - name: "honey"
    label: "Honey Products"
    folder: "src/content/honey"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Price", name: "price", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # ── 4. BLOG / NEWS & UPDATES ──
  - name: "blog"
    label: "News & Updates"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Draft", "Published"]
        default: "Draft"
      - { label: "Body", name: "body", widget: "markdown" }

  # ── 5. FAQ ──
  - name: "faq"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "markdown" }
      - { label: "Order", name: "order", widget: "number", default: 1 }