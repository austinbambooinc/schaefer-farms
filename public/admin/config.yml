# Decap CMS + DecapBridge configuration for Schaefer Farms

# Use DecapBridge PKCE auth
backend:
  name: git-gateway
  repo: austinbambooinc/schaefer-farms
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/ab314ab1-6ca7-4e8f-8161-386409f6aab0/pkce
  auth_token_endpoint: /sites/ab314ab1-6ca7-4e8f-8161-386409f6aab0/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://schaeferfarms.netlify.app

# Uploaded images/files will be saved here in the repo
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: honey
    label: Honey Products
    label_singular: Honey Product
    folder: src/content/honey
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Product Name
        name: title
        widget: string

      - label: Description
        name: description
        widget: text
        required: false

      - label: Price
        name: price
        widget: string
        required: false
        hint: "Example: $12.00"

      - label: Product Image
        name: image
        widget: image
        required: false

      - label: Available
        name: available
        widget: boolean
        default: true
        required: false

      - label: Body
        name: body
        widget: markdown
        required: false

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Page Title
        name: title
        widget: string

      - label: SEO
        name: seo
        widget: object
        required: false
        fields:
          - { label: Meta Title, name: meta_title, widget: string, required: false, hint: "Overrides page title in browser tab & search results (optional)" }
          - { label: Meta Description, name: meta_description, widget: text, required: false, hint: "Shown in search engine results only — not visible on the page" }
          - { label: Meta Keywords, name: meta_keywords, widget: string, required: false, hint: "Comma-separated, optional" }

      - label: Featured Image
        name: image
        widget: image
        required: false

      - label: Body
        name: body
        widget: markdown
        required: false

  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string

      - label: Publish Date
        name: date
        widget: datetime 

      - label: SEO
        name: seo
        widget: object
        required: false
        fields:
          - { label: Meta Title, name: meta_title, widget: string, required: false, hint: "Overrides page title in browser tab & search results (optional)" }
          - { label: Meta Description, name: meta_description, widget: text, required: false, hint: "Shown in search engine results only — not visible on the page" }
          - { label: Meta Keywords, name: meta_keywords, widget: string, required: false, hint: "Comma-separated, optional" }

      - label: Featured Image
        name: image
        widget: image
        required: false

      - label: Body
        name: body
        widget: markdown

  - name: minerals
    label: Minerals
    label_singular: Mineral
    folder: src/content/minerals
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Mineral Name
        name: title
        widget: string

      - label: Description
        name: description
        widget: text
        required: false

      - label: Price
        name: price
        widget: string
        required: false

      - label: Image
        name: image
        widget: image
        required: false

      - label: Available
        name: available
        widget: boolean
        default: true
        required: false

      - label: Body
        name: body
        widget: markdown
        required: false
